{% extends 'jobs/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<style>
    .form-card {
        background: white; border-radius: 18px; padding: 36px;
        box-shadow: 0 4px 16px rgba(167,139,250,0.14);
        border: 1px solid #fbe8ff;
        max-width: 600px; margin: 0 auto;
    }
    .form-title { font-size: 24px; font-weight: 800; color: #4c1d5b; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 700; font-size: 14px; color: #6b5a72; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 11px 14px; border: 2px solid #f3d9f9; border-radius: 12px; font-size: 14px; font-family: 'Poppins', sans-serif; }
    .form-input:focus { outline: none; border-color: #c084fc; }
    .submit-btn {
        background: linear-gradient(135deg, #a78bfa, #f472b6); color: white; border: none;
        padding: 12px 26px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .submit-btn:hover { opacity: 0.9; }
</style>
<div class="form-card">
    <div class="form-title">{{ title }}</div>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="submit-btn">Save Job</button>
    </form>
</div>
{% endblock %}
